debezium.source.connector.class=io.debezium.connector.mysql.MySqlConnector
debezium.source.topic.prefix=oceanbase_mysql_contract
debezium.source.tasks.max=1

debezium.source.database.hostname=oceanbase-mysql-capability-source
debezium.source.database.port=2883
debezium.source.database.user=blackbox_connector@blackbox
debezium.source.database.password=${OCEANBASE_MYSQL_CONNECTOR_PASSWORD}
debezium.source.database.server.id=540014
debezium.source.database.include.list=benchbase
debezium.source.table.include.list=benchbase.usertable,benchbase.checker_run_fence,benchbase.session_txn

debezium.source.snapshot.mode=no_data
debezium.source.snapshot.locking.mode=none
debezium.source.provide.transaction.metadata=true
debezium.source.include.schema.changes=false
debezium.source.tombstones.on.delete=false
debezium.source.event.processing.failure.handling.mode=fail
debezium.source.decimal.handling.mode=string
debezium.source.skipped.operations=none
debezium.source.gtid.ignore.on.recovery=true

debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=/debezium/data/schema-history.dat
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=0

debezium.source.poll.interval.ms=50
debezium.source.max.batch.size=4
debezium.source.max.queue.size=32

debezium.transforms=route
debezium.transforms.route.type=org.apache.kafka.connect.transforms.RegexRouter
debezium.transforms.route.regex=.*
debezium.transforms.route.replacement=cdc

debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false

debezium.sink.type=redis
debezium.sink.redis.address=oceanbase-mysql-capability-redis:6379
debezium.sink.redis.batch.size=3
debezium.sink.redis.retry.initial.delay.ms=100
debezium.sink.redis.retry.max.delay.ms=1000
debezium.sink.redis.connection.timeout.ms=2000
debezium.sink.redis.socket.timeout.ms=15000

quarkus.log.level=INFO
quarkus.log.console.json=false
