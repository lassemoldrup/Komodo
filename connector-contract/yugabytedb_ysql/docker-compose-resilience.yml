name: yugabytedb-ysql-resilience-contract

x-yugabyted-node: &yugabyted-node
  image: docker.io/yugabytedb/yugabyte@sha256:3dfa310a7a595bbf1ec5e6e6e58e31821aa86a8444b65d800fcc2ef6b3953cbb
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        bin/ysqlsh -h "$$(hostname -i | awk '{print $$1}')"
        -U yugabyte -d yugabyte -c 'SELECT 1'
    interval: 3s
    timeout: 5s
    retries: 80
    start_period: 20s
  volumes:
    - ./workload:/connector-contract/workload:ro
  networks: [resilience_contract]

services:
  redis:
    image: docker.io/library/redis@sha256:9702d01c1f10c3ea9f48211b4362e44f154ff02d063e6f7268eba804059f53bf
    container_name: resilience-contract-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "268435456", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [resilience_contract]

  yb_node_1:
    <<: *yugabyted-node
    container_name: resilience-contract-yb-1
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >-
        exec bin/yugabyted start --background=false --callhome=false
        --advertise_address="$$(hostname -i)" --cloud_location=local.region.zone1
        --tserver_flags=ysql_yb_enable_replication_commands=true,ysql_yb_enable_replica_identity=true,cdc_enable_intra_transactional_before_image=true,cdc_send_null_before_image_if_not_exists=false

  yb_node_2:
    <<: *yugabyted-node
    container_name: resilience-contract-yb-2
    depends_on:
      yb_node_1:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >-
        exec bin/yugabyted start --background=false --callhome=false
        --advertise_address="$$(hostname -i)"
        --join="$$(getent hosts yb_node_1 | awk '{print $$1; exit}')"
        --cloud_location=local.region.zone2
        --tserver_flags=ysql_yb_enable_replication_commands=true,ysql_yb_enable_replica_identity=true,cdc_enable_intra_transactional_before_image=true,cdc_send_null_before_image_if_not_exists=false

  yb_node_3:
    <<: *yugabyted-node
    container_name: resilience-contract-yb-3
    depends_on:
      yb_node_2:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >-
        exec bin/yugabyted start --background=false --callhome=false
        --advertise_address="$$(hostname -i)"
        --join="$$(getent hosts yb_node_1 | awk '{print $$1; exit}')"
        --cloud_location=local.region.zone3
        --tserver_flags=ysql_yb_enable_replication_commands=true,ysql_yb_enable_replica_identity=true,cdc_enable_intra_transactional_before_image=true,cdc_send_null_before_image_if_not_exists=false

  initialize:
    image: docker.io/yugabytedb/yugabyte@sha256:3dfa310a7a595bbf1ec5e6e6e58e31821aa86a8444b65d800fcc2ef6b3953cbb
    container_name: resilience-contract-initialize
    depends_on:
      yb_node_1: {condition: service_healthy}
      yb_node_2: {condition: service_healthy}
      yb_node_3: {condition: service_healthy}
    entrypoint: ["/bin/bash", "/connector-contract/initialize-resilience.sh"]
    environment:
      CONNECTOR_CONTRACT_DATABASE_HOST: yb_node_1
      CONNECTOR_CONTRACT_PLUGIN: pgoutput
      CONNECTOR_CONTRACT_SLOT: connector_contract_slot
    volumes:
      - ./initialize.sh:/connector-contract/initialize.sh:ro
      - ./initialize-resilience.sh:/connector-contract/initialize-resilience.sh:ro
      - ./schema.sql:/connector-contract/schema.sql:ro
    restart: "no"
    networks: [resilience_contract]

  debezium_server:
    build:
      context: .
      dockerfile: Dockerfile.debezium-server
    image: db-monitoring/yugabytedb-ysql-connector-contract:dz.2.5.2.yb.2026.1
    container_name: resilience-contract-debezium-server
    depends_on:
      initialize: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    environment:
      DEBEZIUM_SOURCE_DATABASE_HOSTNAME: yb_node_1
      DEBEZIUM_SOURCE_PLUGIN_NAME: pgoutput
      DEBEZIUM_SOURCE_SLOT_NAME: connector_contract_slot
      DEBEZIUM_SINK_REDIS_BATCH_SIZE: "4"
      DEBEZIUM_SOURCE_MAX_BATCH_SIZE: "8"
      DEBEZIUM_SOURCE_MAX_QUEUE_SIZE: "32"
      DEBEZIUM_SOURCE_POLL_INTERVAL_MS: "10"
    volumes:
      - ./application.properties:/debezium/conf/application.properties:ro
    tmpfs:
      - /debezium/data:rw,size=64m
    networks: [resilience_contract]

networks:
  resilience_contract:
    name: yugabytedb-ysql-resilience-contract
