name: yugabytedb-ysql-connector-contract
services:
  debezium_server:
    build:
      context: /home/yifan/code/db-monitoring/si-monitoring/connector-contract/yugabytedb_ysql
      dockerfile: Dockerfile.debezium-server
    container_name: connector-contract-debezium-server
    depends_on:
      initialize:
        condition: service_completed_successfully
        required: true
      redis:
        condition: service_healthy
        required: true
    environment:
      DEBEZIUM_SINK_REDIS_BATCH_SIZE: "3"
      DEBEZIUM_SOURCE_MAX_BATCH_SIZE: "2"
      DEBEZIUM_SOURCE_PLUGIN_NAME: pgoutput
      DEBEZIUM_SOURCE_POLL_INTERVAL_MS: "10"
      DEBEZIUM_SOURCE_SLOT_NAME: connector_contract_slot
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /q/health HTTP/1.0\r\n\r\n' >&3 && grep -q 'UP' <&3"
      timeout: 3s
      interval: 3s
      retries: 40
      start_period: 10s
    image: db-monitoring/yugabytedb-ysql-connector-contract:dz.2.5.2.yb.2026.1
    networks:
      connector_contract: null
    tmpfs:
      - /debezium/data:rw,size=64m
    volumes:
      - type: bind
        source: /home/yifan/code/db-monitoring/si-monitoring/connector-contract/yugabytedb_ysql/application.properties
        target: /debezium/conf/application.properties
        read_only: true
        bind:
          create_host_path: true
  initialize:
    container_name: connector-contract-initialize
    depends_on:
      yugabytedb_ysql:
        condition: service_healthy
        required: true
    entrypoint:
      - /bin/bash
      - /connector-contract/initialize.sh
    environment:
      CONNECTOR_CONTRACT_PLUGIN: pgoutput
      CONNECTOR_CONTRACT_SLOT: connector_contract_slot
    image: docker.io/yugabytedb/yugabyte@sha256:3dfa310a7a595bbf1ec5e6e6e58e31821aa86a8444b65d800fcc2ef6b3953cbb
    networks:
      connector_contract: null
    restart: "no"
    volumes:
      - type: bind
        source: /home/yifan/code/db-monitoring/si-monitoring/connector-contract/yugabytedb_ysql/initialize.sh
        target: /connector-contract/initialize.sh
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /home/yifan/code/db-monitoring/si-monitoring/connector-contract/yugabytedb_ysql/schema.sql
        target: /connector-contract/schema.sql
        read_only: true
        bind:
          create_host_path: true
  redis:
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - "268435456"
      - --maxmemory-policy
      - noeviction
    container_name: connector-contract-redis
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 2s
      interval: 2s
      retries: 30
    image: docker.io/library/redis@sha256:9702d01c1f10c3ea9f48211b4362e44f154ff02d063e6f7268eba804059f53bf
    networks:
      connector_contract: null
  yugabytedb_ysql:
    command:
      - bin/yugabyted
      - start
      - --background=false
      - --callhome=false
      - --tserver_flags=ysql_yb_enable_replication_commands=true,ysql_yb_enable_replica_identity=true,cdc_enable_intra_transactional_before_image=true,cdc_send_null_before_image_if_not_exists=false
    container_name: connector-contract-yugabytedb-ysql
    healthcheck:
      test:
        - CMD
        - bin/ysqlsh
        - -h
        - yugabytedb_ysql
        - -U
        - yugabyte
        - -d
        - yugabyte
        - -c
        - SELECT 1
      timeout: 5s
      interval: 3s
      retries: 60
      start_period: 20s
    image: docker.io/yugabytedb/yugabyte@sha256:3dfa310a7a595bbf1ec5e6e6e58e31821aa86a8444b65d800fcc2ef6b3953cbb
    networks:
      connector_contract: null
    volumes:
      - type: bind
        source: /home/yifan/code/db-monitoring/si-monitoring/connector-contract/yugabytedb_ysql/workload
        target: /connector-contract/workload
        read_only: true
        bind:
          create_host_path: true
networks:
  connector_contract:
    name: yugabytedb-ysql-connector-contract
