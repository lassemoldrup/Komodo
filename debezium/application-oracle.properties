# Pinned Debezium Server 3.6.1 Oracle connector using LogMiner. Credentials,
# source identity, and exact run-owned table membership are injected by the
# coordinator through DEBEZIUM_SOURCE_* environment variables.

debezium.source.connector.class=io.debezium.connector.oracle.OracleConnector
debezium.source.topic.prefix=oracle_blackbox_main

debezium.source.database.hostname=cdc-oracle
debezium.source.database.port=1521
debezium.source.database.dbname=FREE
debezium.source.database.pdb.name=FREEPDB1

# online_catalog avoids writing the data dictionary into redo, which is much
# cheaper. Safe here because the schema is static; it cannot track DDL.
debezium.source.log.mining.strategy=online_catalog

# Only the history the workload generates matters, not prior state.
debezium.source.snapshot.mode=no_data
debezium.source.snapshot.locking.mode=none

debezium.source.provide.transaction.metadata=true
debezium.source.tombstones.on.delete=false
debezium.source.include.schema.changes=false
debezium.source.decimal.handling.mode=string
debezium.source.time.precision.mode=connect

# --- Ordering --------------------------------------------------------------
# Collapse every topic into the one admitted Redis stream. The capability
# evidence, not this routing rule alone, establishes completed commit order.
debezium.transforms=route
debezium.transforms.route.type=org.apache.kafka.connect.transforms.RegexRouter
debezium.transforms.route.regex=.*
debezium.transforms.route.replacement=cdc

# --- Format ----------------------------------------------------------------
debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false

# --- Sink ------------------------------------------------------------------
debezium.sink.type=redis
debezium.sink.redis.address=cdc-redis:6379
debezium.sink.redis.batch.size=1000

# --- Local state -----------------------------------------------------------
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000
debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=/debezium/data/schema-history.dat

debezium.source.log.mining.batch.size.default=20000
debezium.source.log.mining.sleep.time.min.ms=0
debezium.source.log.mining.sleep.time.default.ms=200
debezium.source.log.mining.sleep.time.max.ms=1000
debezium.source.log.mining.sleep.time.increment.ms=200

quarkus.log.level=INFO
quarkus.log.console.json=false
