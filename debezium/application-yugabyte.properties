# ---------------------------------------------------------------------------
# Debezium Server (2.5.2 + YugabyteDB connector) -> single ordered Redis Stream
#
# NOTE: this file is mounted at /debezium/conf/application.properties.
# Debezium 2.5.2 uses /debezium/conf; the 3.x MariaDB server uses
# /debezium/config. Mounting to the wrong one fails with
# "Failed to load mandatory config value 'debezium.sink.type'".
# ---------------------------------------------------------------------------

debezium.source.connector.class=io.debezium.connector.postgresql.YugabyteDBConnector
debezium.source.topic.prefix=cdc

debezium.source.database.hostname=cdc-yugabyte
debezium.source.database.port=5433
debezium.source.database.user=yugabyte
debezium.source.database.password=yugabyte
debezium.source.database.dbname=yugabyte

# yboutput is YugabyteDB's own decoding plugin. The slot is pre-created by
# yugabyte/init.sh with yb_lsn_type=HYBRID_TIME, so autocreate must stay off:
# Debezium would create a SEQUENCE slot and source.lsn would stop being the
# commit hybrid time.
debezium.source.plugin.name=yboutput
debezium.source.slot.name=dbz_si
debezium.source.publication.name=cdc_pub
debezium.source.publication.autocreate.mode=disabled

# Keep this list matching the publication exactly. Transactions touching a
# published-but-excluded table still consume a txId, leaving gaps in the
# sequence; matching the two means any gap is a real signal.
debezium.source.table.include.list=public.registers,public.session_txn

# Schema only: the monitor cares about the history the workload generates.
debezium.source.snapshot.mode=never

debezium.source.provide.transaction.metadata=true
debezium.source.tombstones.on.delete=false
debezium.source.include.schema.changes=false
debezium.source.decimal.handling.mode=string

# --- Ordering --------------------------------------------------------------
# Collapse every topic into one so the Redis sink writes a single stream:
# one stream = one total order = commit order.
debezium.transforms=route
debezium.transforms.route.type=org.apache.kafka.connect.transforms.RegexRouter
debezium.transforms.route.regex=.*
debezium.transforms.route.replacement=cdc

# --- Format ----------------------------------------------------------------
debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false

# --- Sink ------------------------------------------------------------------
debezium.sink.type=redis
debezium.sink.redis.address=cdc-redis:6379
debezium.sink.redis.batch.size=1000

# --- Local state -----------------------------------------------------------
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000
debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=/debezium/data/schema-history.dat

# --- Latency / throughput --------------------------------------------------
debezium.source.poll.interval.ms=10
debezium.source.max.batch.size=2048
debezium.source.max.queue.size=8192

quarkus.log.level=INFO
quarkus.log.console.json=false
