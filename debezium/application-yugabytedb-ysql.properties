debezium.source.connector.class=io.debezium.connector.postgresql.YugabyteDBConnector
debezium.source.topic.prefix=yugabytedb_ysql_main
debezium.source.tasks.max=1

debezium.source.database.hostname=yugabytedb_ysql
debezium.source.database.port=5433
debezium.source.database.user=blackbox_replication
debezium.source.database.password=blackbox_replication_password
debezium.source.database.dbname=benchbase
debezium.source.database.sslmode=disable

debezium.source.plugin.name=pgoutput
debezium.source.slot.name=blackbox_slot
debezium.source.slot.lsn.type=SEQUENCE
debezium.source.publication.name=blackbox_publication
debezium.source.publication.autocreate.mode=disabled
debezium.source.streaming.mode=default
debezium.source.schema.include.list=benchbase
debezium.source.table.include.list=benchbase.usertable,benchbase.checker_run_fence,benchbase.session_txn

debezium.source.snapshot.mode=never
debezium.source.provide.transaction.metadata=true
debezium.source.tombstones.on.delete=false
debezium.source.include.schema.changes=false
debezium.source.event.processing.failure.handling.mode=fail
debezium.source.decimal.handling.mode=string
debezium.source.skipped.operations=none

debezium.transforms=route
debezium.transforms.route.type=org.apache.kafka.connect.transforms.RegexRouter
debezium.transforms.route.regex=.*
debezium.transforms.route.replacement=cdc

debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false

debezium.sink.type=redis
debezium.sink.redis.address=redis:6379
debezium.sink.redis.batch.size=1000
debezium.sink.redis.retry.initial.delay.ms=100
debezium.sink.redis.retry.max.delay.ms=1000
debezium.sink.redis.connection.timeout.ms=2000
debezium.sink.redis.socket.timeout.ms=2000

debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=0
debezium.source.poll.interval.ms=10
debezium.source.max.batch.size=2048
debezium.source.max.queue.size=8192

quarkus.log.level=INFO
quarkus.log.console.json=false
