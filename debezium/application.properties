# ---------------------------------------------------------------------------
# Debezium Server: MariaDB binlog -> single ordered Redis Stream.
# ---------------------------------------------------------------------------

debezium.source.connector.class=io.debezium.connector.mariadb.MariaDbConnector
# Stable backend/connector identity shared with RunManifest and ClientTxn.
# RegexRouter below still collapses every emitted topic into Redis stream cdc.
debezium.source.topic.prefix=mariadb-main

debezium.source.database.hostname=mariadb
debezium.source.database.port=3306
debezium.source.database.user=debezium
debezium.source.database.password=debezium_pw
debezium.source.database.server.id=184054
# Capture every table in the fenced database. The monitor owns the application
# and control allowlists and must see, then reject, writes to any other table.
debezium.source.database.include.list=benchbase

# Schema only, no initial data: the monitor cares about the history the
# workload generates, not the state that preceded it.
debezium.source.snapshot.mode=no_data

# BEGIN/END markers, and a transaction block on every change event. The END
# marker's event_count is what tells the monitor a write set is complete
# without having to wait for the next transaction to arrive.
debezium.source.provide.transaction.metadata=true

# Nothing downstream compacts by key, so tombstones are pure overhead.
debezium.source.tombstones.on.delete=false
# DDL is unsupported during an audited run, so it must remain observable for
# the monitor to fail closed with DDL_OBSERVED.
debezium.source.include.schema.changes=true

# Exact decimal values rather than base64-encoded unscaled bytes.
debezium.source.decimal.handling.mode=string
debezium.source.time.precision.mode=connect

# --- Ordering --------------------------------------------------------------
# Collapse every topic into one, so the Redis sink writes everything to a
# single stream. One stream = one total order = binlog order = commit order.
debezium.transforms=route
debezium.transforms.route.type=org.apache.kafka.connect.transforms.RegexRouter
debezium.transforms.route.regex=.*
debezium.transforms.route.replacement=cdc

# --- Format ----------------------------------------------------------------
debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false

# --- Sink ------------------------------------------------------------------
debezium.sink.type=redis
debezium.sink.redis.address=redis:6379
debezium.sink.redis.batch.size=1000

# --- Local state -----------------------------------------------------------
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000
debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=/debezium/data/schema-history.dat

# --- Latency / throughput --------------------------------------------------
# Small poll interval keeps end-to-end latency low; the batch/queue sizes
# stop a burst of commits from stalling the reader.
debezium.source.poll.interval.ms=10
debezium.source.max.batch.size=2048
debezium.source.max.queue.size=8192

quarkus.log.level=INFO
quarkus.log.console.json=false
