name: si-monitoring

# CDC pipeline for Snapshot Isolation anomaly monitoring. Three interchangeable
# backends, one shared downstream half:
#
#   MariaDB    --binlog--------------\
#   YugabyteDB --logical repl (HT)-----+-- Debezium Server --> Redis "cdc" --> C++ monitor
#   Oracle     --LogMiner (commit SCN)/
#
# Exactly one backend runs at a time; all write to the same Redis stream, so
# the monitor reads one place regardless of backend.
#
#   make up              # MariaDB   (default)
#   make up DB=yugabyte  # YugabyteDB
#   make up DB=oracle    # Oracle

services:
  # ---------------------------------------------------------------- shared --
  redis:
    image: redis:7-alpine
    container_name: cdc-redis
    # appendonly off + no RDB snapshots: the stream is a transient transport,
    # not a system of record. Removes fsync from the hot path.
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 2gb
      --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [cdc]

  # --------------------------------------------------------------- MariaDB --
  mariadb:
    profiles: [mariadb]
    # Pinned rather than :lts so experiment runs stay reproducible when the
    # LTS alias advances. Override per run:
    #   MARIADB_IMAGE=mariadb:11.8 make up
    image: ${MARIADB_IMAGE:-mariadb:12.3}
    container_name: cdc-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpw}
      MARIADB_DATABASE: sitest
    ports:
      - "3306:3306"
    volumes:
      - ./mariadb/conf.d:/etc/mysql/conf.d:ro
      - ./mariadb/initdb:/docker-entrypoint-initdb.d:ro
    # tmpfs datadir: throwaway harness; keeps disk I/O out of the measured
    # workload. Everything is lost on container stop, which is what we want.
    tmpfs:
      - /var/lib/mysql:rw,size=2g
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [cdc]

  debezium:
    profiles: [mariadb]
    image: quay.io/debezium/server:3.6.1.Final
    container_name: cdc-debezium
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./debezium/application.properties:/debezium/config/application.properties:ro
    # tmpfs, NOT a named volume: the databases here are all ephemeral (tmpfs
    # datadir / container layer), so persisted offsets would outlive the
    # binlog they point into. `down` + `up` then resumes at a position from a
    # previous database lifetime and silently emits transaction boundaries
    # with zero row events. Tying offset lifetime to container lifetime makes
    # that unrepresentable.
    tmpfs:
      - /debezium/data:rw,size=64m
    networks: [cdc]

  # ------------------------------------------------------------ YugabyteDB --
  yugabyte:
    profiles: [yugabyte]
    image: ${YUGABYTE_IMAGE:-yugabytedb/yugabyte:latest}
    container_name: cdc-yugabyte
    # cdc_enable_intra_transactional_before_image: without it, touching a row
    # again after INSERTing it in the same transaction makes the CDC service
    # fail to compute a before-image, and the connector then retries forever.
    # See "Two operational rules" in the README.
    command: >
      bin/yugabyted start --background=false
      --tserver_flags=ysql_yb_enable_replication_commands=true,ysql_yb_enable_replica_identity=true,cdc_enable_intra_transactional_before_image=true
    ports:
      - "5433:5433"
      - "15433:15433"
    healthcheck:
      test: ["CMD", "bin/ysqlsh", "-h", "cdc-yugabyte", "-c", "SELECT 1"]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 30s
    networks: [cdc]

  # Init must complete before the connector starts, and ORDER MATTERS:
  # all schema first, replication slot last. DDL against a table with an
  # active slot permanently breaks before-images (see README).
  yugabyte-init:
    profiles: [yugabyte]
    image: ${YUGABYTE_IMAGE:-yugabytedb/yugabyte:latest}
    container_name: cdc-yugabyte-init
    depends_on:
      yugabyte:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init/init.sh"]
    environment:
      YB_HOST: cdc-yugabyte
      SLOT_NAME: ${YB_SLOT:-dbz_si}
    volumes:
      - ./yugabyte:/init:ro
    restart: "no"
    networks: [cdc]

  debezium-yb:
    profiles: [yugabyte]
    build:
      context: ./debezium
      dockerfile: Dockerfile.yugabyte
    image: si-dbz-yb:2.5.2
    container_name: cdc-debezium-yb
    depends_on:
      yugabyte-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      # 2.5.2 reads /debezium/conf; the 3.x MariaDB server reads /debezium/config
      - ./debezium/application-yugabyte.properties:/debezium/conf/application.properties:ro
    tmpfs:
      - /debezium/data:rw,size=64m
    networks: [cdc]

  # ---------------------------------------------------------------- Oracle --
  oracle:
    profiles: [oracle]
    # 23.26 renamed the banner to "Oracle AI Database 26ai ...", which broke
    # Debezium <=3.2 (it resolved the version with
    # `WHERE BANNER_FULL LIKE 'Oracle Database%'`). 3.6.1 reads the version
    # from JDBC metadata instead, so current Oracle works. See README.
    image: ${ORACLE_IMAGE:-gvenzl/oracle-free:23.26.2-slim}
    container_name: cdc-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-oraclepw}
    ports:
      - "1521:1521"
    volumes:
      # Runs on every start: ARCHIVELOG, supplemental logging, CDC user, schema.
      - ./oracle/startdb.d:/container-entrypoint-startdb.d:ro
    healthcheck:
      # Gate on the setup hook finishing, not just the listener being up.
      # A file test rather than a sqlplus call: sqlplus startup can exceed a
      # short healthcheck timeout and leave the container stuck in "starting".
      test: ["CMD-SHELL", "test -f /tmp/cdc-setup.done"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    networks: [cdc]

  debezium-oracle:
    profiles: [oracle]
    image: quay.io/debezium/server:3.6.1.Final
    container_name: cdc-debezium-oracle
    depends_on:
      oracle:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./debezium/application-oracle.properties:/debezium/config/application.properties:ro
    tmpfs:
      - /debezium/data:rw,size=64m
    networks: [cdc]

networks:
  cdc:
    name: cdc
