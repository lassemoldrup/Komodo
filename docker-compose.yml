name: si-monitoring

# CDC pipeline for Snapshot Isolation anomaly monitoring. Three interchangeable
# backend profiles, one shared downstream half:
#
#   MariaDB    --binlog--------------\
#   YugabyteDB --one SEQUENCE slot------+-- Debezium Server --> Redis "cdc" --> C++ monitor
#   Oracle     --LogMiner (commit SCN)/
#   OceanBase  --ODP/official obbinlog--/
#
# Exactly one backend runs at a time; all write to the same Redis stream, so
# the monitor reads one place regardless of backend.
#
#   make up              # MariaDB   (default)
#   make up DB=yugabytedb_ysql  # YugabyteDB YSQL
#   make up DB=oracle    # Oracle

services:
  # ---------------------------------------------------------------- shared --
  redis:
    image: docker.io/library/redis@sha256:9702d01c1f10c3ea9f48211b4362e44f154ff02d063e6f7268eba804059f53bf
    container_name: cdc-redis
    # appendonly off + no RDB snapshots: the stream is a transient transport,
    # not a system of record. Removes fsync from the hot path.
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory ${BLACKBOX_REDIS_MAXMEMORY_BYTES:-2147483648}
      --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [cdc]

  # --------------------------------------------------------------- MariaDB --
  mariadb:
    profiles: [mariadb]
    # Pinned rather than :lts so experiment runs stay reproducible when the
    # LTS alias advances. Override per run:
    #   MARIADB_IMAGE=mariadb:11.8 make up
    image: ${MARIADB_IMAGE:-mariadb:12.3}
    container_name: cdc-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpw}
      # The application/control schema is created empty by initdb before the
      # connector is allowed to start. BenchBase's loader is the first writer.
      MARIADB_DATABASE: benchbase
    ports:
      - "3306:3306"
    volumes:
      - ./mariadb/conf.d:/etc/mysql/conf.d:ro
      - ./mariadb/initdb/01-users.sql:/docker-entrypoint-initdb.d/01-users.sql:ro
      - ./mariadb/initdb/02-schema.sql:/docker-entrypoint-initdb.d/02-common-schema.sql:ro
      - ${BLACKBOX_ADAPTER_SCHEMA_FILE:-./mariadb/initdb/adapters/ycsb.sql}:/docker-entrypoint-initdb.d/03-application-schema.sql:ro
    # tmpfs datadir: throwaway harness; keeps disk I/O out of the measured
    # workload. Everything is lost on container stop, which is what we want.
    tmpfs:
      - /var/lib/mysql:rw,size=2g
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [cdc]

  debezium:
    profiles: [mariadb]
    image: ${MARIADB_DEBEZIUM_IMAGE:-quay.io/debezium/server:3.6.1.Final}
    container_name: cdc-debezium
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./debezium/application.properties:/debezium/config/application.properties:ro
    # tmpfs, NOT a named volume: the databases here are all ephemeral (tmpfs
    # datadir / container layer), so persisted offsets would outlive the
    # binlog they point into. `down` + `up` then resumes at a position from a
    # previous database lifetime and silently emits transaction boundaries
    # with zero row events. Tying offset lifetime to container lifetime makes
    # that unrepresentable.
    tmpfs:
      - /debezium/data:rw,size=64m
    networks: [cdc]

  # ------------------------------------------------------------ YugabyteDB --
  yugabytedb_ysql:
    profiles: [yugabytedb_ysql]
    image: docker.io/yugabytedb/yugabyte@sha256:3dfa310a7a595bbf1ec5e6e6e58e31821aa86a8444b65d800fcc2ef6b3953cbb
    container_name: cdc-yugabytedb-ysql
    command: >
      bin/yugabyted start --background=false --callhome=false
      --tserver_flags=ysql_yb_enable_replication_commands=true,ysql_yb_enable_replica_identity=true,cdc_enable_intra_transactional_before_image=${BLACKBOX_YSQL_INTRA_TRANSACTIONAL_BEFORE_IMAGE:-false},cdc_send_null_before_image_if_not_exists=${BLACKBOX_YSQL_SEND_NULL_BEFORE_IMAGE:-true},db_write_buffer_size=${BLACKBOX_YSQL_DB_WRITE_BUFFER_SIZE:-134217728}
    ports:
      - "5433:5433"
      - "15433:15433"
    healthcheck:
      test: ["CMD", "bin/ysqlsh", "-h", "yugabytedb_ysql", "-U", "yugabyte", "-d", "yugabyte", "-c", "SELECT 1"]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 30s
    networks: [cdc]

  yugabytedb_ysql_init:
    profiles: [yugabytedb_ysql]
    image: docker.io/yugabytedb/yugabyte@sha256:3dfa310a7a595bbf1ec5e6e6e58e31821aa86a8444b65d800fcc2ef6b3953cbb
    container_name: cdc-yugabytedb-ysql-init
    depends_on:
      yugabytedb_ysql:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/blackbox/init.sh"]
    environment:
      BLACKBOX_YSQL_SLOT_NAME: ${BLACKBOX_YSQL_SLOT_NAME:-blackbox_slot}
      BLACKBOX_YSQL_PUBLICATION_NAME: ${BLACKBOX_YSQL_PUBLICATION_NAME:-blackbox_publication}
      BLACKBOX_YSQL_CAPTURE_TABLES: ${BLACKBOX_YSQL_CAPTURE_TABLES:-benchbase.usertable,benchbase.checker_run_fence,benchbase.session_txn}
      BLACKBOX_YSQL_CREATE_CAPTURE_OBJECTS: ${BLACKBOX_YSQL_CREATE_CAPTURE_OBJECTS:-true}
      BLACKBOX_YSQL_REPLICA_IDENTITY: ${BLACKBOX_YSQL_REPLICA_IDENTITY:-DEFAULT}
    volumes:
      - ./yugabytedb_ysql/init.sh:/blackbox/init.sh:ro
      - ./yugabytedb_ysql/initdb/02-common-schema.sql:/blackbox/common-schema.sql:ro
      - ${BLACKBOX_ADAPTER_SCHEMA_FILE:-./yugabytedb_ysql/initdb/adapters/ycsb.sql}:/blackbox/adapter-schema.sql:ro
    restart: "no"
    networks: [cdc]

  debezium_yugabytedb_ysql:
    profiles: [yugabytedb_ysql]
    build:
      context: ./debezium
      dockerfile: Dockerfile.yugabytedb-ysql
    image: db-monitoring/yugabytedb-ysql:dz.2.5.2.yb.2026.1
    container_name: cdc-debezium-yugabytedb-ysql
    depends_on:
      yugabytedb_ysql_init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DEBEZIUM_SOURCE_SLOT_NAME: ${BLACKBOX_YSQL_SLOT_NAME:-blackbox_slot}
      DEBEZIUM_SOURCE_PUBLICATION_NAME: ${BLACKBOX_YSQL_PUBLICATION_NAME:-blackbox_publication}
      DEBEZIUM_SOURCE_TOPIC_PREFIX: ${BLACKBOX_BACKEND_SOURCE_ID:-yugabytedb_ysql_main}
      DEBEZIUM_SOURCE_TABLE_INCLUDE_LIST: ${BLACKBOX_YSQL_CAPTURE_TABLES:-benchbase.usertable,benchbase.checker_run_fence,benchbase.session_txn}
    volumes:
      - ./debezium/application-yugabytedb-ysql.properties:/debezium/conf/application.properties:ro
    tmpfs:
      - /debezium/data:rw,size=64m
    networks: [cdc]

  # ---------------------------------------------------------------- Oracle --
  oracle:
    profiles: [oracle]
    image: docker.io/gvenzl/oracle-free@sha256:fbbd3023d5abc33e36d3814816e6fd740e8efabeaa70cf470ddeab5874a3f6f8
    container_name: cdc-oracle
    environment:
      ORACLE_PASSWORD: ${BLACKBOX_ORACLE_SYS_PASSWORD:-BlackboxOracleSys_2026}
      BLACKBOX_ORACLE_LOGMINER_PASSWORD: ${BLACKBOX_ORACLE_LOGMINER_PASSWORD:-BlackboxLogMiner_2026}
    ports:
      - "1521:1521"
    volumes:
      # Database-lifetime prerequisites only; no application rows or tables.
      - ./oracle/startdb.d:/container-entrypoint-startdb.d:ro
    healthcheck:
      # Gate on the setup hook finishing, not just the listener being up.
      # A file test rather than a sqlplus call: sqlplus startup can exceed a
      # short healthcheck timeout and leave the container stuck in "starting".
      test: ["CMD-SHELL", "test -f /tmp/blackbox-oracle-prerequisites.done"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    networks: [cdc]

  oracle_init:
    profiles: [oracle]
    image: docker.io/gvenzl/oracle-free@sha256:fbbd3023d5abc33e36d3814816e6fd740e8efabeaa70cf470ddeab5874a3f6f8
    container_name: cdc-oracle-init
    depends_on:
      oracle:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/blackbox/init.sh"]
    environment:
      BLACKBOX_ORACLE_SYS_PASSWORD: ${BLACKBOX_ORACLE_SYS_PASSWORD:-BlackboxOracleSys_2026}
      BLACKBOX_ORACLE_OWNER_PASSWORD: ${BLACKBOX_ORACLE_OWNER_PASSWORD:-BlackboxOwner_2026}
      BLACKBOX_ORACLE_APPLICATION_PASSWORD: ${BLACKBOX_ORACLE_APPLICATION_PASSWORD:-BlackboxApplication_2026}
      BLACKBOX_ORACLE_CAPTURE_TABLES: ${BLACKBOX_ORACLE_CAPTURE_TABLES:-BLACKBOX_OWNER.ACCOUNTS,BLACKBOX_OWNER.SAVINGS,BLACKBOX_OWNER.CHECKING,BLACKBOX_OWNER.CHECKER_RUN_FENCE,BLACKBOX_OWNER.SESSION_TXN}
    volumes:
      - ./oracle/init.sh:/blackbox/init.sh:ro
      - ./oracle/initdb/02-common-schema.sql:/blackbox/common-schema.sql:ro
      - ${BLACKBOX_ADAPTER_SCHEMA_FILE:-./oracle/initdb/adapters/smallbank.sql}:/blackbox/adapter-schema.sql:ro
      - ${BLACKBOX_ADAPTER_WARMUP_FILE:-./oracle/initdb/adapters/smallbank-warmup.sql}:/blackbox/adapter-warmup.sql:ro
    restart: "no"
    networks: [cdc]

  debezium-oracle:
    profiles: [oracle]
    image: quay.io/debezium/server@sha256:8d3a3ad6e16ccc52c2efbb76b2e8198697f1e4bfe67ed5557b405a5a01c85da5
    container_name: cdc-debezium-oracle
    depends_on:
      oracle_init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DEBEZIUM_SOURCE_DATABASE_USER: c##blackbox_logminer
      DEBEZIUM_SOURCE_DATABASE_PASSWORD: ${BLACKBOX_ORACLE_LOGMINER_PASSWORD:-BlackboxLogMiner_2026}
      DEBEZIUM_SOURCE_TOPIC_PREFIX: ${BLACKBOX_BACKEND_SOURCE_ID:-oracle_blackbox_main}
      DEBEZIUM_SOURCE_TABLE_INCLUDE_LIST: ${BLACKBOX_ORACLE_CAPTURE_TABLES:-BLACKBOX_OWNER.ACCOUNTS,BLACKBOX_OWNER.SAVINGS,BLACKBOX_OWNER.CHECKING,BLACKBOX_OWNER.CHECKER_RUN_FENCE,BLACKBOX_OWNER.SESSION_TXN}
    volumes:
      - ./debezium/application-oracle.properties:/debezium/config/application.properties:ro
    tmpfs:
      - /debezium/data:rw,size=64m
    networks: [cdc]

  # -------------------------------------------------------- OceanBase MySQL --
  oceanbase-mysql:
    profiles: [oceanbase_mysql]
    image: db-monitoring/oceanbase-mysql-capability-source:4.4.2.1-obbinlog4.3.6.4
    pull_policy: never
    container_name: cdc-oceanbase-mysql
    hostname: oceanbase-mysql
    cap_add: [SYS_NICE]
    ulimits:
      nofile: 65535
      nproc: 65535
    environment:
      CLUSTER_NAME: oceanbase_blackbox
      TENANT_NAME: blackbox
      PASSWORD: ${BLACKBOX_OCEANBASE_MYSQL_ROOT_PASSWORD:-OceanBaseContract_2026}
      DATAFILE_SIZE: 5G
      LOG_DISK_SIZE: 4G
      BLACKBOX_OCEANBASE_MYSQL_CAPTURE_TABLES: ${BLACKBOX_OCEANBASE_MYSQL_CAPTURE_TABLES:-}
    ports:
      - "2883:2883"
    volumes:
      - ./oceanbase_mysql/initdb/01-principals.sql:/oceanbase-mysql-contract/setup/create-principals.sql:ro
      - ${BLACKBOX_ADAPTER_SCHEMA_FILE:-./oceanbase_mysql/initdb/adapters/ycsb.sql}:/oceanbase-mysql-contract/setup/create-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -f /tmp/oceanbase-mysql-schema-before-binlog.complete
          && obclient -A -c -h127.0.0.1 -P2983
          -e "SHOW BINLOG SERVER FOR TENANT \`oceanbase_blackbox\`.\`blackbox\`;"
          | grep -Eq 'blackbox.*8100.*OK'
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 240s
    networks: [cdc]

  debezium-oceanbase-mysql:
    profiles: [oceanbase_mysql]
    image: quay.io/debezium/server@sha256:11124f362db7c99096ead22237374075f42737c68487cb790e69bdc4ce2e817f
    container_name: cdc-debezium-oceanbase-mysql
    depends_on:
      oceanbase-mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DEBEZIUM_SOURCE_TOPIC_PREFIX: ${BLACKBOX_BACKEND_SOURCE_ID:-oceanbase_mysql_main}
      DEBEZIUM_SOURCE_TABLE_INCLUDE_LIST: ${BLACKBOX_OCEANBASE_MYSQL_CAPTURE_TABLES:-}
      DEBEZIUM_SOURCE_DATABASE_PASSWORD: ${BLACKBOX_OCEANBASE_MYSQL_CONNECTOR_PASSWORD:-OceanBaseConnector_2026!}
    volumes:
      - ./debezium/application-oceanbase-mysql.properties:/debezium/config/application.properties:ro
    tmpfs:
      - /debezium/data:rw,size=64m
    networks: [cdc]

networks:
  cdc:
    name: cdc
